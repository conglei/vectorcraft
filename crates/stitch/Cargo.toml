[package]
name = "vectorcraft-stitch"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "VectorCraft embroidery: the stitch plan, machine profiles and stitches from paths"

[lints]
workspace = true

[dependencies]
vectorcraft-geom = { workspace = true }
vectorcraft-color = { workspace = true }
vectorcraft-doc = { workspace = true }
# Type is sewn as lettering from its laid-out glyphs (without the bundled fonts: the apps choose).
vectorcraft-text = { workspace = true }
kurbo = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
# Source Sans 3 for lettering tests of real glyphs.
vectorcraft-text = { workspace = true, features = ["bundled-fonts"] }
